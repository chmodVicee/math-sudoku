# Override para equipos donde Docker no puede crear redes bridge
# (por ejemplo: "failed to create endpoint ... operation not supported").
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.host.yml up -d --build
#
# Todos los contenedores comparten la red del host y se usan puertos que no
# chocan con un PostgreSQL/Java ya instalado:
#   - frontend: http://localhost:80
#   - backend:  http://localhost:8090
#   - postgres: localhost:5434
services:
  db:
    network_mode: host
    ports: !reset []
    # Evita el 5432 del PostgreSQL del sistema.
    command: ["postgres", "-p", "5434"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathsudoku -d mathsudoku -p 5434"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      network: host
      entitlements: ["network.host"]
    network_mode: host
    ports: !reset []
    environment:
      DB_URL: jdbc:postgresql://127.0.0.1:5434/mathsudoku
      SERVER_PORT: 8090
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8090'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      network: host
      entitlements: ["network.host"]
    network_mode: host
    ports: !reset []
    environment:
      BACKEND_UPSTREAM: http://127.0.0.1:8090
