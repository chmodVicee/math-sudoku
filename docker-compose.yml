services:
  db:
    image: postgres:16-alpine
    container_name: mathsudoku-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mathsudoku
      POSTGRES_USER: mathsudoku
      POSTGRES_PASSWORD: mathsudoku
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - mathsudoku_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathsudoku -d mathsudoku"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: mathsudoku-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/mathsudoku
      DB_USER: mathsudoku
      DB_PASSWORD: mathsudoku
      JWT_SECRET: ${JWT_SECRET:-math-sudoku-dev-secret-key-change-me-0123456789abcdef}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-1440}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build:
      context: ./frontend
    container_name: mathsudoku-frontend
    restart: unless-stopped
    environment:
      BACKEND_UPSTREAM: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mathsudoku_pgdata:
